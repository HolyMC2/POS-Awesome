name: Build Verify

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-verify:
    name: Production build and artifact gates
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # See frontend/ci/saldo-stubs/README.md — private sibling repo absent in CI.
      - name: Provide saldo sibling stubs (private repo absent in CI)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../saldo/saldo/public/saldo_pos"
          cp -r "$GITHUB_WORKSPACE/frontend/ci/saldo-stubs/." "$GITHUB_WORKSPACE/../saldo/saldo/public/saldo_pos/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            frontend/yarn.lock

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Build production frontend
        run: yarn build

      - name: Test build verifier
        run: yarn test:build-verify

      - name: Verify emitted POS assets
        run: yarn verify:build

      - name: Electron package smoke
        run: yarn electron:smoke

      - name: Upload build provenance
        uses: actions/upload-artifact@v4
        with:
          name: posawesome-build-provenance
          path: |
            posawesome/public/dist/js/version.json
            posawesome/public/dist/js/checksums.sha256
          if-no-files-found: error
