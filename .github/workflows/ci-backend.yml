name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend:
    name: Python lint and Frappe tests
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:10.6
        ports:
          - 3306:3306
        env:
          MYSQL_USER: user
          MYSQL_PASSWORD: frappe
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: frappe
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ruff frappe-bench
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # mariadb-client: frappe v15 shells out to the `mariadb` binary to
          # restore the new-site DB template; the runner image only ships the
          # `mysql` client, so new-site died with ExecutableNotFound (this is
          # what kept Backend CI red — reproduced + fixed 2026-07-02).
          sudo apt-get install -y redis-server libmysqlclient-dev mariadb-client

      - name: Ruff syntax smoke
        run: python -m ruff check --select E9,F63,F7 posawesome

      - name: Initialize Frappe bench
        run: bench init --frappe-branch version-15 --python python3 frappe-bench

      - name: Start Frappe Redis services
        run: |
          cd frappe-bench
          for service in redis_cache redis_queue redis_socketio; do
            if [ -f "config/${service}.conf" ]; then
              redis-server "config/${service}.conf" --daemonize yes
            fi
          done
          redis-cli -p 11000 ping

      # The site/app setup is split into one step per command so a failure is
      # visible at step granularity from the public API (job logs need auth).
      - name: Create test site
        run: |
          cd frappe-bench
          bench new-site example.com \
            --mariadb-root-password frappe \
            --admin-password frappe \
            --no-mariadb-socket

      - name: Get ERPNext
        run: cd frappe-bench && bench get-app --branch version-15 https://github.com/frappe/erpnext

      - name: Install ERPNext
        run: cd frappe-bench && bench --site example.com install-app erpnext

      # --skip-assets: get-app otherwise runs `bench build --app posawesome`,
      # whose vite build needs the private saldo sibling (absent here) and
      # fails the step. This backend job never serves assets — Build Verify
      # covers the frontend build (with CI stubs).
      - name: Get POS Awesome
        run: cd frappe-bench && bench get-app --skip-assets "$GITHUB_WORKSPACE"

      - name: Install POS Awesome
        run: cd frappe-bench && bench --site example.com install-app posawesome

      - name: POS Awesome backend unit smoke
        run: python -m unittest discover -s posawesome/posawesome/api -p "test_offline_sync_*.py"
